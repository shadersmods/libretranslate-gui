[package]
name = "libretranslate-gui"
version = "0.2.7"
edition = "2024"
rust-version = "1.88"
description = "A native Rust desktop manager for local LibreTranslate instances"

[features]
ui-test = []

[dependencies]
anyhow = "1"
directories = "6"
dunce = "1"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", default-features = false }
arboard = { version = "3", default-features = false }
dioxus-asset-resolver = "0.7.10"
flate2 = "1"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time", "sync", "fs", "io-util"] }
sys-locale = "0.3"
webbrowser = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
dioxus-desktop = { path = "vendor/dioxus-desktop" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = false
