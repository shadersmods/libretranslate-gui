name: Feature request
description: Suggest a change to LibreTranslate GUI.
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and how the change would help. Search existing issues before opening a new request.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where the current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior you would like, with an example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried, or what other approach could work?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant platforms, mockups, or examples. Remove secrets and private data from attachments.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/shadersmods/libretranslate-gui/blob/main/CODE_OF_CONDUCT.md).
          required: true
