name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python tests/model_sync.py
      - run: python tests/release_packaging.py
      - run: python tests/windows_installer.py
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'
      - run: python tests/windows_installer.py --smoke
        if: runner.os == 'Windows'
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx build --platform desktop --release --locked
      - name: Package Windows ZIP and MSI
        if: runner.os == 'Windows'
        run: |
          python .github/package_release.py --current-version
          python .github/build_msi.py
          python tests/windows_installer.py --verify-package (Get-ChildItem release/*.msi).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: libretranslate-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/dx/**/release/**
            assets/icon.png
            assets/icon.ico
            assets/icon.icns
            README.md
            release/*
          if-no-files-found: error
